[project]
name = "quokka-edge"
version = "0.1.0"
description = "Research into compact multimodal local agents."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = []

[dependency-groups]
dev = [
    "pre-commit>=4,<5",
    "ruff>=0.15,<1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 88
extend-exclude = ["docs/internal", "artifacts"]
force-exclude = true

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
